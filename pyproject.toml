[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "block-gnn"
version = "0.2.0"
description = "Compile frozen PyTorch Conv2d layers into sparse inference operators"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hesam Damghanian"}]
dependencies = ["torch>=2.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Sk7w4tch3r/block-gnn"
Documentation = "https://github.com/Sk7w4tch3r/block-gnn/tree/master/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
block_gnn = ["csrc/*.cpp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["cpp: compiles and exercises the optional LibTorch extension"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
